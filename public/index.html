<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Context-Aware Security Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #020617, #000);
      color: #e5e7eb;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #020617;
    }

    .secondary {
      background: #1e293b;
      color: #e5e7eb;
    }

    .attack {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
    }

    /* 🔔 POPUP NOTIFICATION (TOP-LEFT) */
    #notification {
      position: fixed;
      top: 20px;
      left: 20px;
      min-width: 300px;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: bold;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: none;
      z-index: 9999;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #attackInfo {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-left: 5px solid #ef4444;
    }

    pre {
      background: #020617;
      padding: 18px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

  <!-- 🔔 NOTIFICATION POPUP -->
  <div id="notification">❌ Invalid credentials. Please try again.</div>

  <div class="container">

    <h1>🔐 Context-Aware Security Decision Dashboard</h1>

    <div class="card">
      <h3>Access Request</h3>

      <div class="inputs">
        <input id="username" placeholder="Username">
        <input id="password" placeholder="Password">
        <input id="resource" placeholder="Resource (admin)">
      </div>

      <div class="buttons">
        <button class="primary" onclick="normalAccess()">Check Access</button>
        <button class="secondary" onclick="loadLogs()">View Audit Logs</button>
      </div>
    </div>

    <div class="card">
      <h3>🚨 Threat Simulator</h3>

      <button class="attack" onclick="simulateBruteForce()">Brute Force Attack</button>
      <button class="attack" onclick="simulatePrivilegeEscalation()">Privilege Escalation</button>
      <button class="attack" onclick="simulateOffHours()">Off-Hours Access</button>
    </div>

    <div class="card">
      <div id="attackInfo"></div>
      <pre id="output">{ }</pre>
    </div>

  </div>

  <script>
    async function sendRequest(attackType, payload) {

      const notification = document.getElementById("notification");
      const attackInfo = document.getElementById("attackInfo");

      attackInfo.style.display = "block";
      attackInfo.innerText = "🚨 Attack Type Detected: " + attackType;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      // ❌ Show popup on invalid credentials
      if (!res.ok) {
        notification.style.display = "block";
        output.innerText = JSON.stringify(data, null, 2);
        return;
      }

      // ✅ Hide popup automatically on success
      notification.style.display = "none";
      output.innerText = JSON.stringify(data, null, 2);
    }

    function normalAccess() {
      sendRequest("Normal Access Request", {
        username: username.value,
        password: password.value,
        resource: resource.value
      });
    }

    function simulateBruteForce() {
      sendRequest("Brute Force Attack", {
        username: "user",
        password: "wrongpassword",
        resource: "admin"
      });
    }

    function simulatePrivilegeEscalation() {
      sendRequest("Privilege Escalation Attack", {
        username: "user",
        password: "user123",
        resource: "admin"
      });
    }

    function simulateOffHours() {
      sendRequest("Off-Hours Access Attack", {
        username: "admin",
        password: "admin123",
        resource: "admin"
      });
    }

    async function loadLogs() {
      const res = await fetch("/logs");
      const data = await res.json();
      document.getElementById("notification").style.display = "none";
      document.getElementById("attackInfo").style.display = "none";
      output.innerText = JSON.stringify(data, null, 2);
    }
  </script>

</body>
</html>
